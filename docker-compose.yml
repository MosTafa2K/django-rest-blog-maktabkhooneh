services:
  backend:
    container_name: backend
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - "./core:/app"
    environment:
      - DEBUG=1
    depends_on:
      - db
      - redis

  # celery-worker:
  #   build: .
  #   command: celery -A core worker -l INFO
  #   depends_on:
  #     - redis
  #     - backend
  #   volumes:
  #     - ./core:/app

  # celery-beat:
  #   build: .
  #   command: celery -A core beat -l INFO
  #   depends_on:
  #     - redis
  #     - backend
  #   volumes:
  #     - ./core:/app

  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  smtp4dev:
    image: docker.arvancloud.ir/rnwood/smtp4dev
    restart: always
    ports:
      - "5000:80"
      - "25:25"
      - "143:143"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions_HostName=smtp4dev

  master:
    image: docker.arvancloud.ir/locustio/locust:latest
    ports:
      - "8089:8089"
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master -H http://backend:8000

  worker:
    image: docker.arvancloud.ir/locustio/locust:latest
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master

  redis:
    image: redis:8.2-m01-alpine
    container_name: redis_client
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    ports:
      - "6379:6379"
  
volumes:
  postgres_data:
  smtp4dev-data:
